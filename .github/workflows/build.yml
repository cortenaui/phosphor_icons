name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile all modules
        run: ./gradlew :phosphor-icons:compileAndroidMain :catalog:compileDebugKotlin --stacktrace

      - name: Assemble release AARs
        run: ./gradlew :phosphor-icons:assemble --stacktrace

      - name: Validate publication metadata
        run: ./gradlew :phosphor-icons:generatePomFileForKotlinMultiplatformPublication --stacktrace
